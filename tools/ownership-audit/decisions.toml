# Every callable in crates/coven-core and crates/coven receives one reviewed
# ownership disposition. `ownership_audit.py check` rejects omissions.

[[decision]]
symbol = "coven_core::database::make_remote::<Database>::mark_make_remote_cancelling_on"
signature = "pub(crate) fn mark_make_remote_cancelling_on( conn: &Connection, root_table: &str, root_id: &str, ) -> Result<(), DbError>"
classification = "delete"
reason = "The state change has no lifetime independent from cancel_make_remote, whose transaction contains it."
status = "verified"

[[decision]]
symbol = "coven_core::database::write_lifecycle::<Database>::notify_write_status_in"
signature = "pub(super) fn notify_write_status_in( statuses: &Arc<std::sync::Mutex<HashMap<WriteId, tokio::sync::watch::Sender<WriteStatus>>>>, write_id: &WriteId, status: WriteStatus, )"
classification = "delete"
reason = "Its only caller is Database::notify_write_status, which already owns the sender map."
status = "verified"

