# The owner rules of the fixtures in this folder, each type by its path.
rules = ["capability-construction", "retained-capability-parameters"]
test_support_features = ["test-utils"]
capability_types = ["owners_base::time::Clock", "owners_base::time::SystemClock"]
capability_traits = ["owners_base::time::Clock"]
construction_only_capability_types = ["owners_base::files::StoreDir"]
shared_state_types = ["std::sync::atomic::AtomicU64"]
private_state_types = ["std::sync::Mutex"]
shared_pointer_types = ["std::sync::Arc"]
task_types = ["owners::Task"]

[handles]
"owners::Requests" = "owners::Query"
"owners_parameters::Requests" = "owners_parameters::Query"

[composition_roots]
"src/lib.rs" = ["Builder::open", "REGISTRY"]
"parameters.rs" = ["View::assemble"]

[capability_factories."src/lib.rs"]
"Directory::file" = "owners_base::files::StoreDir"
