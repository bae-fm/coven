[package]
name = "typed-lints"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The lints' tests run them in the driver, as cargo runs it (../driver/tests).
# This crate has no tests of its own, and a test binary of it would not find
# the compiler's libLLVM, which the driver's build script locates.
[lib]
test = false
doctest = false

[dependencies]
# The `[target.<platform>]` tables of the workspace's manifests
# (`src/crate_graph.rs`), at the version clippy's own dependencies lock.
cargo-platform = "0.3.3"
clippy_config = { path = "../clippy/clippy_config" }
clippy_lints = { path = "../clippy/clippy_lints" }
clippy_utils = { path = "../clippy/clippy_utils" }
# The workspace's policy file, which the structural checker reads too.
owner-construction-policy = { path = "../../owner-construction-policy" }
toml = "1.1"

[package.metadata.rust-analyzer]
rustc_private = true
