# coven, as spec/coven.md describes it.
[workspace]
resolver = "2"
members = ["crates/coven-foundation", "crates/coven-crypto", "crates/coven-merge", "crates/coven-format", "crates/coven-database", "crates/coven-storage", "crates/coven-sync", "crates/coven", "tools/owner-construction-check"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

# One version per external dependency for the whole workspace (Appendix F.1). Members
# name these with `workspace = true` and the features they need; they never
# restate a version. The checker refuses a member dependency that does.
[workspace.dependencies]
coven-foundation = { path = "crates/coven-foundation" }
coven-crypto = { path = "crates/coven-crypto" }
coven-merge = { path = "crates/coven-merge" }
coven-format = { path = "crates/coven-format" }
coven-database = { path = "crates/coven-database" }
coven-storage = { path = "crates/coven-storage" }
coven-sync = { path = "crates/coven-sync" }
rusqlite = "0.41.1"
sqlite3-parser = "0.17.0"
async-trait = "0.1.92"
futures-util = "0.3.34"
tokio = "1.53.2"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false }
http = "1.5.0"
http-body = "1.1.0"
bytes = "1.12.1"
oauth2 = { version = "5.0.0", default-features = false }
open = "5.4.4"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-cloud-kit = { version = "0.3.2", default-features = false }
axum = "0.8.9"
aws-sdk-s3 = { version = "1.152.0", default-features = false }
aws-credential-types = "1.3.0"
aws-smithy-async = "1.3.0"
aws-smithy-runtime-api = "1.19.0"
argon2 = { version = "0.6.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
chacha20 = { version = "0.10.2", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
base64 = "0.23.1"
hkdf = "0.13.0"
hmac = "0.13.0"
subtle = "2.6.1"
sha2 = { version = "0.11.0", default-features = false }
zeroize = "1.9.0"
keyring-core = "1.0.0"
apple-native-keyring-store = "1.0.2"
security-framework = "3.7.0"
android-native-keyring-store = "1.0.0"
jni = { version = "0.22.4", default-features = false }
ndk-context = "0.1.1"
# The verifier reqwest's `rustls` feature checks certificates with; coven
# starts it itself on Android (api.md E1).
rustls-platform-verifier = { version = "0.7.1", default-features = false }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = "1.0.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "visit"] }
thiserror = "2.0"
toml = "1.1"
uuid = "1.27.0"
const-random = "0.1.18"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
windows-sys = "0.61.2"
windows = { version = "0.62.2", default-features = false }
zbus = { version = "5.19.0", default-features = false }
futures-lite = { version = "2.6.1", default-features = false }
rustix = "1.1.5"
libc = "0.2.190"
icu_casemap = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

[workspace.lints.rust]
# Every `pub` not reachable from the crate's own root must be `pub(crate)` or
# narrower (Appendix F.5). `pub` silences `dead_code` unconditionally, so this is also
# what lets an unused internal item show up as dead.
unreachable_pub = "deny"
dead_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
# Composition roots and owner constructors take their collaborators by name
# (Appendix F.3), so long argument lists are the intended shape there.
too_many_arguments = "allow"
new_without_default = "allow"
# Error enums carry their causes inline so callers match them without
# indirection (Appendix F.5).
large_enum_variant = "allow"
result_large_err = "allow"
# A dropped Result or error is how a failure's cause disappears. Each site
# that discards one on purpose says why with `#[expect(..., reason)]`.
let_underscore_must_use = "deny"
map_err_ignore = "deny"

[profile.dev]
incremental = true
# Line tables keep backtraces' file:line and keep every rlib small in each
# checkout's own target dir. Local-variable inspection under lldb is what this
# gives up.
debug = "line-tables-only"

[profile.test]
# Tests build once per change; incremental state for every test build of every
# crate filled checkouts (37 GB in one), and sccache caches non-incremental
# builds only.
incremental = false
opt-level = 1
debug = "line-tables-only"

# Dependencies build at the test profile's opt-level 1, except the crypto
# crates below at opt-level 3: the Argon2id key derivation (64 MiB) in the
# passphrase tests, the hashes and ciphers, and the Curve25519 code are the
# tests' CPU-bound dependency code. The list holds the constant-time and
# zeroizing helpers too (`subtle`, `cmov`, `ctutils`, `zeroize`): with only the
# algorithm crates, `coven-format --lib codes` took 35-70 s against 23-25 s with
# the `"*"` wildcard, and with the helpers added it is back at 23-25 s. Every
# other timed test group matched the wildcard within noise. Building the rest
# of the tree (aws-sdk-s3, reqwest, rustls, icu data, syn) at opt-level 3
# cost CPU and sped up none of the timed groups: a cold `coven` test build
# took 528 s of CPU with the wildcard, 478 s with this list. List a crate here
# by name; `build-override` does not beat a `package."*"` entry.
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.test.package.chacha20]
opt-level = 3
[profile.test.package.chacha20poly1305]
opt-level = 3
[profile.test.package.poly1305]
opt-level = 3
[profile.test.package.curve25519-dalek]
opt-level = 3
[profile.test.package.ed25519-dalek]
opt-level = 3
[profile.test.package.x25519-dalek]
opt-level = 3
[profile.test.package.hkdf]
opt-level = 3
[profile.test.package.hmac]
opt-level = 3
[profile.test.package.digest]
opt-level = 3
[profile.test.package.cipher]
opt-level = 3
[profile.test.package.aead]
opt-level = 3
[profile.test.package.crypto-common]
opt-level = 3
[profile.test.package.block-buffer]
opt-level = 3
[profile.test.package.cmov]
opt-level = 3
[profile.test.package.ctutils]
opt-level = 3
[profile.test.package.subtle]
opt-level = 3
[profile.test.package.zeroize]
opt-level = 3
[profile.test.package.hybrid-array]
opt-level = 3
[profile.test.package.inout]
opt-level = 3
[profile.test.package.ed25519]
opt-level = 3
[profile.test.package.signature]
opt-level = 3
[profile.test.package.rand_core]
opt-level = 3
[profile.test.package.cpufeatures]
opt-level = 3
[profile.test.package.base64ct]
opt-level = 3

[patch.crates-io]
# v0.17.0 plus the scanner fix that builds a token's debug position only when it is kept.
sqlite3-parser = { git = "https://github.com/bae-fm/lemon-rs", rev = "c0fc0b12a08a8bab5cdd93182e99344dca796cd3" }
