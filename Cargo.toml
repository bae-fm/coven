[package]
name = "coven"
version = "0.0.0-dev"
edition = "2021"

[lib]
name = "coven"
path = "src/lib.rs"
# `cdylib` builds the wasm module wasm-pack wraps for the browser facade
# (`wasm_facade`); `rlib` keeps coven a normal Rust library so the native build,
# `cargo test`, and crates that depend on coven (e.g. bae) link it as before.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["seal"] }
rand = "0.9"
uuid = { version = "1.0", features = ["v4", "js"] }
urlencoding = "2.1"
keyring-core = "0.7"
# Provides the `FallibleStreamingIterator` trait `rusqlite::session::ChangesetIter`
# implements; pinned to the same 0.1 line rusqlite depends on so we share the type.
fallible-streaming-iterator = "0.1.9"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
bytes = "1.11"
futures-util = "0.3"
tracing = "0.1.41"

# Native targets: the bundled C SQLite, the AWS S3 stack, the local
# OAuth-callback HTTP server, the browser-opener, and filesystem home-dir lookup.
# None compile on (or apply to) wasm32 — the browser gets these capabilities a
# different way (rusqlite's wasm FFI, a fetch-based S3 client, a redirect OAuth
# flow) in later work.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.40", features = ["session", "bundled"] }
libsqlite3-sys = { version = "0.38.0", features = ["session", "bundled"] }
axum = "0.7"
open = "5.3"
dirs = "5.0"
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["rt-tokio", "sigv4a"] }
aws-credential-types = "1.2"
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["default-client", "rustls-ring"] }

# wasm: rusqlite without `bundled` resolves its FFI to sqlite-wasm-rs (a pure
# wasm32 SQLite built with the session + preupdate extensions). getrandom 0.3's
# wasm_js backend feeds rand from the browser crypto RNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# No net/fs/process on wasm (those pull mio, which has no wasm support); the
# browser runtime drives sync off the JS event loop in later work.
tokio = { version = "1.0", features = ["rt", "sync", "macros", "time", "io-util"] }
rusqlite = { version = "0.40", features = ["session"] }
# The wasm SQLite that rusqlite's no-bundle path resolves to. Named directly (not
# just pulled transitively through rusqlite) so the OPFS VFS install can reference
# `sqlite_wasm_rs::WasmOsCallback`; pinned to the same line rusqlite links, so the
# VFS registers into the very SQLite the connection uses.
sqlite-wasm-rs = "0.5"
# The opfs-sahpool VFS: SQLite-over-OPFS via per-file FileSystemSyncAccessHandles,
# making the connection durable across page loads. Worker-only (the sync access
# handles are not available on the main thread), which is why DB code runs on a
# dedicated Worker.
sqlite-wasm-vfs = "0.2"
# Two getrandom majors reach the browser RNG two different ways: rand 0.9 pulls
# getrandom 0.3 (wasm_js feature + the cfg in .cargo/config.toml); the RustCrypto
# stack (rand_core 0.6 under chacha20poly1305/crypto_box/dalek) pulls getrandom
# 0.2, whose `js` feature enables the same backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_legacy = { package = "getrandom", version = "0.2", features = ["js"] }
# Wall-clock source for the HLC on wasm: `js_sys::Date::now()`. `std::time` has no
# wasm backend (`SystemTime::now()` panics), so the HLC reads epoch millis from
# the browser clock instead.
js-sys = "0.3"
# AWS SigV4 signing for the fetch-based S3 backend. reqsign-aws-v4 signs an
# `http::Request`'s parts with a static credential; the AWS SDK it replaces on
# native is C/tokio-bound and won't build for wasm. Whichever request lacks an
# `x-amz-content-sha256` header is signed UNSIGNED-PAYLOAD, which is what a
# browser sending bodies over `fetch` (no body pre-hash) needs.
reqsign-core = "3"
reqsign-aws-v4 = "3"
# reqsign reads the signing time through `jiff::Timestamp::now()`, which panics on
# wasm32-unknown-unknown unless jiff's `js` feature bridges to the browser clock.
# Named directly only to turn that feature on for the transitive dependency.
jiff = { version = "0.2", features = ["js"] }
# The fetch-based S3 backend builds and signs `http::Request`s directly (reqsign
# signs the parts, reqwest's wasm Client sends them). Shares reqwest's `http` 1.x.
http = "1"
# URL-encoding for S3 object keys and query values (the fetch S3 backend builds
# request URLs by hand). Pulled in transitively by reqsign already; named directly
# so the encoding rule lives on a maintained crate instead of a hand-rolled scan.
percent-encoding = "2.3"
# ListObjectsV2 XML parsing for the fetch S3 backend. The response is untrusted
# S3 output, so a real parser (entity expansion, namespace/attribute tolerance,
# malformed-input errors) handles it instead of a hand-rolled tag scanner. In tree
# transitively via reqsign; named directly here. Default features only — no serde,
# no encoding_rs (S3 returns UTF-8).
quick-xml = "0.40"
# The browser drives the sync runtime off its single event loop. `spawn_local`
# runs the cycle loop as a `!Send` task on that loop (the wasm `Database` is
# `!Send`); gloo-timers' `TimeoutFuture` (the `futures` feature makes it awaitable)
# is the idle/backoff wait between cycles — the wasm counterpart of the native
# loop's thread + `tokio::time::sleep`.
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
# The JS-callable facade (`wasm_facade::CovenLibrary`). `wasm-bindgen` exposes the
# struct + its async methods to JavaScript; `serde-wasm-bindgen` converts the JS
# config object and the query result rows across the boundary without a hand-rolled
# `JsValue` walk.
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# Routes Rust panics to `console.error` so a panic in the browser surfaces with its
# message and a stack instead of an opaque `unreachable`. The facade installs it in
# `open`; it is shipped code (not just the test harness), so it is a normal dep.
console_error_panic_hook = "0.1"
# OPFS (Origin Private File System) for the device-local blob files. coven reads a
# blob on push and writes it on pull; `std::fs` has no wasm backend, so the wasm
# `local_blob` reads/writes through the browser's OPFS sync access handles instead —
# the same stable, Worker-only API the SQLite VFS runs on (no `web_sys_unstable_apis`).
web-sys = { version = "0.3", features = [
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemReadWriteOptions",
] }

# The headless wasm tests drive a real dedicated Worker in Firefox. Belongs only on
# wasm; native tests the thread-actor path instead.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5"

# The wasm S3 backend (`storage::cloud::s3_wasm`) is shipped only on wasm, but its
# pure URL/XML helpers and its SigV4 signing run as plain `#[test]`s under
# `cargo test` so they're covered in native CI. That compiles the module on native
# in test builds, which needs its signing + http deps available there too.
[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["test-util"] }
reqsign-core = "3"
reqsign-aws-v4 = "3"
jiff = "0.2"
http = "1"
percent-encoding = "2.3"
quick-xml = "0.40"
serial_test = "3.4.0"

[features]
test-utils = []
# The item-sharing capability: the `share` module's `ShareProxy` type (mints and
# revokes item shares over any CloudHome) plus its `BlobId` logical ref. Off by
# default; sharing is not a storage backend and adds no CloudProvider variant
# either way.
share-proxy = []

[lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"
