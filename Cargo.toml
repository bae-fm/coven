[workspace]
members = [
    "crates/coven-core",
    "crates/coven",
]
resolver = "2"

[workspace.lints.rust]
# Every `pub` not reachable from the crate's own root must be `pub(crate)` (or
# narrower). This re-arms `dead_code` on internal items — `pub` silences that
# lint unconditionally, so an unreachable `pub` item can rot unused and
# unnoticed. Fix by narrowing visibility, never by widening it to route around
# the lint.
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"

# Debug (unoptimized) builds of the async Circle/membership operations spend
# several times more stack per `poll` frame than optimized builds — each poll
# reserves scratch sized to its whole generator, and these operations compose
# many large generators into one deep, non-recursive call graph. Release builds
# of the same flows fit in well under 512 KiB of stack; unoptimized they needed
# ~2 MiB, over the 2 MiB default thread stack on Linux (whose usable per-thread
# stack is slightly smaller than macOS), so CI's debug `cargo test` overflowed
# deterministically. Optimizing coven-core's test build collapses the poll-frame
# scratch (the flows fit in <512 KiB again) and speeds its crypto-heavy tests.
[profile.test.package.coven-core]
opt-level = 1

# The coven crate's device-join drivers stack the same deep async frames on
# top of coven-core's; unoptimized poll-frame layout overflows CI's default
# test-thread stack just as it did for coven-core.
[profile.test.package.coven]
opt-level = 1
