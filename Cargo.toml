[package]
name = "coven"
version = "0.0.0-dev"
edition = "2021"

[lib]
name = "coven"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["seal"] }
rand = "0.9"
uuid = { version = "1.0", features = ["v4", "js"] }
urlencoding = "2.1"
keyring-core = "0.7"
# Provides the `FallibleStreamingIterator` trait `rusqlite::session::ChangesetIter`
# implements; pinned to the same 0.1 line rusqlite depends on so we share the type.
fallible-streaming-iterator = "0.1.9"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
bytes = "1.11"
futures-util = "0.3"
tracing = "0.1.41"

# Native targets: the bundled C SQLite, the AWS S3 stack, the local
# OAuth-callback HTTP server, the browser-opener, and filesystem home-dir lookup.
# None compile on (or apply to) wasm32 — the browser gets these capabilities a
# different way (rusqlite's wasm FFI, a fetch-based S3 client, a redirect OAuth
# flow) in later work.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.40", features = ["session", "bundled"] }
libsqlite3-sys = { version = "0.38.0", features = ["session", "bundled"] }
axum = "0.7"
open = "5.3"
dirs = "5.0"
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["rt-tokio", "sigv4a"] }
aws-credential-types = "1.2"
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["default-client", "rustls-ring"] }

# wasm: rusqlite without `bundled` resolves its FFI to sqlite-wasm-rs (a pure
# wasm32 SQLite built with the session + preupdate extensions). getrandom 0.3's
# wasm_js backend feeds rand from the browser crypto RNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# No net/fs/process on wasm (those pull mio, which has no wasm support); the
# browser runtime drives sync off the JS event loop in later work.
tokio = { version = "1.0", features = ["rt", "sync", "macros", "time", "io-util"] }
rusqlite = { version = "0.40", features = ["session"] }
# The wasm SQLite that rusqlite's no-bundle path resolves to. Named directly (not
# just pulled transitively through rusqlite) so the OPFS VFS install can reference
# `sqlite_wasm_rs::WasmOsCallback`; pinned to the same line rusqlite links, so the
# VFS registers into the very SQLite the connection uses.
sqlite-wasm-rs = "0.5"
# The opfs-sahpool VFS: SQLite-over-OPFS via per-file FileSystemSyncAccessHandles,
# making the connection durable across page loads. Worker-only (the sync access
# handles are not available on the main thread), which is why DB code runs on a
# dedicated Worker.
sqlite-wasm-vfs = "0.2"
# Two getrandom majors reach the browser RNG two different ways: rand 0.9 pulls
# getrandom 0.3 (wasm_js feature + the cfg in .cargo/config.toml); the RustCrypto
# stack (rand_core 0.6 under chacha20poly1305/crypto_box/dalek) pulls getrandom
# 0.2, whose `js` feature enables the same backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_legacy = { package = "getrandom", version = "0.2", features = ["js"] }

# The headless wasm test (tests/wasm_opfs.rs) drives a real dedicated Worker in
# Firefox to prove the connection persists through OPFS. None of these belong on
# native, which tests the thread-actor path instead.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3.4.0"

[features]
test-utils = []
# The item-sharing capability: the `share` module's `ShareProxy` type (mints and
# revokes item shares over any CloudHome) plus its `BlobId` logical ref. Off by
# default; sharing is not a storage backend and adds no CloudProvider variant
# either way.
share-proxy = []

[lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"
