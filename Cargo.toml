[workspace]
members = [
    "crates/coven",
    "tools/owner-construction-check",
]
resolver = "2"

[workspace.lints.rust]
# Every `pub` not reachable from the crate's own root must be `pub(crate)` (or
# narrower). This re-arms `dead_code` on internal items — `pub` silences that
# lint unconditionally, so an unreachable `pub` item can rot unused and
# unnoticed. Fix by narrowing visibility, never by widening it to route around
# the lint.
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"

[profile.dev]
incremental = true

[profile.test]
incremental = true

# Debug builds of the async Circle/membership operations reserve more stack per
# `poll` frame than optimized builds. Optimize Coven's test build so the complete
# composed flows fit within the test runner's thread stack.
[profile.test.package.coven]
opt-level = 1

# Tests drive the complete signing, hashing, encryption, and SQLite paths.
# Optimize their third-party implementations so test runtime measures Coven's
# behavior rather than debug builds of those dependencies.
[profile.test.package."*"]
opt-level = 3
