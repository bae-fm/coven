name = "covenStorelogData"
defaultTargets = ["CovenStorelogData", "storelogDataRunner", "accessRunner", "accessKeyRunner", "rotationRunner"]

[[require]]
name = "covenMerge"
path = "../merge"

[[require]]
name = "covenStorelog"
path = "../storelog"

[[lean_lib]]
name = "CovenStorelogData"

[[lean_lib]]
name = "StorelogDataEffects"

[[lean_lib]]
name = "PendingJson"

[[lean_exe]]
name = "storelogDataRunner"
root = "StorelogDataRunner"

[[lean_exe]]
name = "accessRunner"
root = "AccessRunner"

[[lean_exe]]
name = "accessKeyRunner"
root = "AccessKeyRunner"

[[lean_exe]]
name = "rotationRunner"
root = "RotationRunner"
