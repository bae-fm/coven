name = "covenMerge"
defaultTargets = ["CovenMerge", "mergeRunner", "receiveRunner"]

[leanOptions]
linter.unusedSectionVars = false

[[require]]
name = "covenStorage"
path = "../storage"

[[lean_lib]]
name = "CovenMerge"

[[lean_exe]]
name = "mergeRunner"
root = "MergeRunner"

[[lean_exe]]
name = "receiveRunner"
root = "ReceiveRunner"
