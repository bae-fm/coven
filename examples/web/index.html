<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coven two-tab notes</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      form {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: grid;
        gap: 0.15rem;
        font-size: 0.85rem;
      }
      input {
        padding: 0.4rem;
        font: inherit;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
        cursor: pointer;
        justify-self: start;
      }
      #note-form {
        grid-template-columns: 1fr auto;
        align-items: end;
      }
      #status {
        font-size: 0.85rem;
        color: #777;
      }
      #status[data-on="true"] {
        color: #2a7;
      }
      #error {
        color: #c33;
        white-space: pre-wrap;
        font-size: 0.85rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <h1>coven two-tab notes</h1>
    <p id="error" hidden></p>

    <section id="config">
      <p>
        Fill in an S3 (or S3-compatible) bucket the browser can reach with CORS
        enabled (see the README), then open the library in two tabs to watch notes
        sync between them.
      </p>
      <form id="config-form">
        <label>bucket <input name="bucket" required /></label>
        <label>region <input name="region" value="us-east-1" required /></label>
        <label>endpoint (blank for AWS) <input name="endpoint" placeholder="https://s3.example.com" /></label>
        <label>access key <input name="access_key" required /></label>
        <label>secret key <input name="secret_key" type="password" required /></label>
        <label>key prefix (optional) <input name="key_prefix" placeholder="coven/demo" /></label>
        <label>library id <input name="library_id" value="demo-notes" required /></label>
        <button type="submit">Open library</button>
      </form>
    </section>

    <section id="app" hidden>
      <p id="status">sync: stopped</p>
      <form id="note-form">
        <label>new note <input id="note-body" placeholder="type a note…" autocomplete="off" /></label>
        <button type="submit">Add</button>
      </form>
      <ul id="notes"></ul>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
