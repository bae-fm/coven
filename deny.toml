# `cargo deny check licenses`: the third-party licenses coven accepts.
# `cargo deny check bans`: dependencies coven must never take on.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # r-efi is LGPL-2.1-or-later.
    "LGPL-2.1-or-later",
    # webpki-root-certs: CA certificate data, CDLA-Permissive-2.0 (open data license).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Appendix F.1 sets each workspace dependency's version once; versions deeper in
# the tree are their crates' own choice.
multiple-versions = "allow"
deny = [
    # Every HTTPS request checks certificates with rustls-platform-verifier,
    # through coven's one reqwest client. A client trusting another root list
    # breaks on Android: native root lists come from openssl-probe, which there
    # looks only at Termux's path, not /system/etc/security/cacerts, so the
    # AWS SDK's own client panicked with "TrustStore configured to enable
    # native roots but no valid root certificates parsed!" and an S3 restore
    # failed. The verifier itself reads the OS's certificate files on Linux,
    # where they are the platform's trust, and bundles roots only for wasm.
    { crate = "aws-smithy-http-client", reason = "S3 runs over coven's reqwest client; this client reads native roots, which openssl-probe doesn't find on Android" },
    { crate = "rustls-native-certs", wrappers = ["rustls-platform-verifier"], reason = "openssl-probe finds no native root list on Android; trust comes from rustls-platform-verifier" },
    { crate = "webpki-roots", reason = "a bundled root list is not the platform's trust; use rustls-platform-verifier" },
    { crate = "webpki-root-certs", wrappers = ["rustls-platform-verifier"], reason = "a bundled root list is not the platform's trust; use rustls-platform-verifier" },
]

[advisories]
# An ignore that matches nothing fails, so one is removed once its crate is gone.
unused-ignored-advisory = "deny"
# A yanked release fails the check; update the crate.
yanked = "deny"
ignore = [
    # pin-utils: unmaintained, pulled in by aws-smithy-http <- aws-sdk-s3 <- coven-storage.
    # No maintained release replaces it until the AWS SDK drops it; it is a few
    # pinning macros with no runtime state.
    "RUSTSEC-2026-0441",
    # zvariant, zbus_names, zvariant_derive: unmaintained standalone crates,
    # pulled by zbus 5, which the Linux Secret Service keyring store
    # (zbus-secret-service-keyring-store <- secret-service 5.2.0, its latest
    # release) depends on and coven-foundation's network watcher uses directly.
    # No safe upgrade until secret-service moves to zbus 6, which incorporates
    # these crates.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
