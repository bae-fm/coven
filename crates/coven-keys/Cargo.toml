[package]
name = "coven-keys"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "Key custody, encryption, and sealed-secret owners underneath Coven"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven_keys"
path = "src/lib.rs"

[dependencies]
coven-foundation = { workspace = true }

argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
crypto_box = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
keyring-core = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { workspace = true }
# Only for downcasting the OSStatus out of `keyring_core::Error::PlatformFailure`
# in `map_keyring_error` — this crate never calls the Security framework
# directly otherwise.
security-framework = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# A `cfg(test)` build of this crate reaches the foundation staged-file test
# hooks, which exist only under that crate's own `test-utils`. `cfg(test)`
# enables no `[features]` of this crate, so they arrive through this edge.
coven-foundation = { workspace = true, features = ["test-utils"] }

[features]
# The Apple keyring entry facts a host's tests assert against, and the cipher
# a host's tests construct directly.
test-utils = []
# The OAuth token accessors on the key service. Only a build that speaks to an
# OAuth provider stores tokens in the keyring.
oauth-providers = []

[lints]
workspace = true
