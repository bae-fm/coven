[package]
name = "coven-core"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "Engine crate for coven: changeset capture, encryption, membership, and sync"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["seal"] }
x25519-dalek = "3.0.0"
rand = "0.9"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
fallible-streaming-iterator = "0.1.9"
bytes = "1.11"
futures-util = "0.3"
tracing = "0.1.41"
tempfile = { version = "3.8", optional = true }
rusqlite = { version = "0.40", default-features = false, features = ["session", "bundled", "hooks", "column_metadata"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3.4.0"
tempfile = "3.27.0"

[features]
test-utils = ["dep:tempfile"]

[lints]
workspace = true
