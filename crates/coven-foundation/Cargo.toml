[package]
name = "coven-foundation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-utils = []

[dependencies]
icu_casemap.workspace = true
icu_normalizer.workspace = true
icu_segmenter.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "time"] }

# `fcntl`, which sets a file's Apple protection class (api.md E1), and the
# blocks Network.framework's path monitor calls (api.md E5).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true
block2.workspace = true

# The network watch's Java callback and its native methods, through JNI with
# the app's context (api.md E1, E5).
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

# The wall-clock deadline's timerfd, which the runtime's reactor waits on
# (§13.2).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
tokio = { workspace = true, features = ["net"] }

# The network watch's NetworkManager, on the system bus, followed on a
# thread of the watch's own (api.md E5).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, features = ["async-io"] }
futures-lite = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# The network watch's internet connection profile, a WinRT API, which
# windows-sys doesn't bind (api.md E5).
windows = { workspace = true, features = ["std", "Networking_Connectivity"] }
# The wall-clock deadline's waitable timer needs Win32_Foundation's handles
# and Win32_Security's declaration of CreateWaitableTimerExW (§13.2).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Wdk_System_Threading", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
