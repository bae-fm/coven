[package]
name = "coven"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "End-to-end encrypted, multi-writer SQLite sync over bring-your-own storage"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven"
path = "src/lib.rs"

[dependencies]
coven-database = { workspace = true }
coven-foundation = { workspace = true }
coven-keys = { workspace = true }
coven-protocol = { workspace = true }
coven-replication = { workspace = true }
coven-storage = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rusqlite = { workspace = true }

[dev-dependencies]
# The public cloud-home API an integration test drives takes `Bytes` payloads,
# and reads back a stream.
bytes = { workspace = true }
futures-util = { workspace = true }
keyring-core = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# The authorize URL an OAuth integration test parses.
url = { workspace = true }
# A `cfg(test)` build of this crate re-exports the foundation and keys test
# hooks, which exist only under those crates' own `test-utils`. `cfg(test)`
# enables no `[features]` of this crate, so they arrive through these edges.
coven-database = { workspace = true, features = ["test-utils"] }
coven-foundation = { workspace = true, features = ["test-utils"] }
coven-keys = { workspace = true, features = ["test-utils"] }
coven-protocol = { workspace = true, features = ["test-utils"] }
coven-replication = { workspace = true, features = ["test-utils"] }
coven-storage = { workspace = true, features = ["test-utils"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
# The Apple keyring integration test asserts against the real store's own
# types; coven itself reaches the platform keyring only through coven-keys.
apple-native-keyring-store = { workspace = true }

[features]
# Hosts building test doubles against Coven get the same fakes Coven itself
# tests with: the foundation clock and id fakes, and the keys test hooks.
test-utils = [
    "coven-database/test-utils",
    "coven-foundation/test-utils",
    "coven-keys/test-utils",
    "coven-protocol/test-utils",
    "coven-replication/test-utils",
    "coven-storage/test-utils",
]
oauth-providers = ["coven-keys/oauth-providers", "coven-storage/oauth-providers"]

[lints]
workspace = true

# Needs the `entry_for` test hook, which only exists under `test-utils` (or a
# `cfg(test)` build of this crate itself, which an integration test binary
# never is). Without this, `cargo test`/`cargo clippy --all-targets` run with
# no features would try to build this target and fail; declaring the
# requirement makes Cargo skip it instead, the same way
# `apple-native-keyring-store` itself gates its own protected-store examples
# and tests on its `protected` feature.
[[test]]
name = "apple_keyring"
required-features = ["test-utils"]
