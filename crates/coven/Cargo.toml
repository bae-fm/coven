[package]
name = "coven"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "End-to-end encrypted, multi-writer SQLite sync over bring-your-own storage"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven"
path = "src/lib.rs"

[dependencies]
coven-core = { path = "../coven-core", version = "1.0.0-rc.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.9", features = ["derive"] }
chacha20poly1305 = "0.10"
rand = "0.9"
uuid = { version = "1.0", features = ["v4"] }
keyring-core = "0.7"
bytes = "1.11"
futures-util = "0.3"
tracing = "0.1.41"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.40", features = ["session", "bundled"] }
axum = "0.7"
open = { version = "5.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["rt-tokio", "sigv4a"] }
aws-sdk-sts = { version = "=1.107.0", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "1.2"
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["default-client", "rustls-ring"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "0.2", features = ["protected"] }
# Only for downcasting the OSStatus out of `keyring_core::Error::PlatformFailure`
# in `map_keyring_error` (see crates/coven/src/keys.rs) — coven never calls the
# Security framework directly otherwise.
security-framework = "3.7"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "0.5"

[dev-dependencies]
coven-core = { path = "../coven-core", version = "1.0.0-rc.1", features = ["test-utils"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
keyring-core = "0.7"
tempfile = "3.8"

[features]
test-utils = ["coven-core/test-utils"]
oauth-providers = ["dep:open"]

[lints]
workspace = true

# Needs the `entry_for` test hook, which only exists under `test-utils` (or a
# `cfg(test)` build of this crate itself, which an integration test binary
# never is). Without this, `cargo test`/`cargo clippy --all-targets` run with
# no features would try to build this target and fail; declaring the
# requirement makes Cargo skip it instead, the same way
# `apple-native-keyring-store` itself gates its own protected-store examples
# and tests on its `protected` feature.
[[test]]
name = "apple_keyring"
required-features = ["test-utils"]
