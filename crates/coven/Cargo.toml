[package]
name = "coven"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "End-to-end encrypted, multi-writer SQLite sync over bring-your-own storage"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven"
path = "src/lib.rs"

[dependencies]
coven-foundation = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
crypto_box = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
fallible-streaming-iterator = { workspace = true }
keyring-core = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }
axum = { workspace = true }
open = { workspace = true, optional = true }
reqwest = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sts = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-http-client = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { workspace = true }
# Only for downcasting the OSStatus out of `keyring_core::Error::PlatformFailure`
# in `map_keyring_error` (see crates/coven/src/keys.rs) — coven never calls the
# Security framework directly otherwise.
security-framework = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
keyring-core = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# A `cfg(test)` build of this crate re-exports the foundation clock and id
# fakes, which exist only under that crate's own `test-utils`. `cfg(test)`
# enables no `[features]` of this crate, so the fakes arrive through this edge.
coven-foundation = { workspace = true, features = ["test-utils"] }

[features]
# Hosts building test doubles against Coven get the same fakes Coven itself
# tests with, foundation clock and id fakes included.
test-utils = ["coven-foundation/test-utils"]
oauth-providers = ["dep:open"]

[lints]
workspace = true

# Needs the `entry_for` test hook, which only exists under `test-utils` (or a
# `cfg(test)` build of this crate itself, which an integration test binary
# never is). Without this, `cargo test`/`cargo clippy --all-targets` run with
# no features would try to build this target and fail; declaring the
# requirement makes Cargo skip it instead, the same way
# `apple-native-keyring-store` itself gates its own protected-store examples
# and tests on its `protected` feature.
[[test]]
name = "apple_keyring"
required-features = ["test-utils"]
