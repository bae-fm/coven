[package]
name = "coven-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Coven's local schema as SQL text, with no connection and no runtime."
keywords = ["sqlite", "sql", "schema"]
categories = ["database"]

[features]
# `compiler_setup`, for an app's build script that runs sqlive-compose's
# compiler.
compiler = ["dep:sqlive-compose"]

[dependencies]
sqlive-compose = { workspace = true, features = ["compiler"], optional = true }

[lints]
workspace = true
