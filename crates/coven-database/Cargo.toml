[package]
name = "coven-database"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-utils = ["coven-format/test-utils", "coven-foundation/test-utils", "sqlive/test-utils"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
coven-crypto.workspace = true
coven-foundation.workspace = true
coven-merge.workspace = true
coven-format.workspace = true
coven-schema.workspace = true
sqlive.workspace = true
sqlive-compose.workspace = true
sqlite3-parser.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-lite = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "io-util"] }
uuid.workspace = true

[dev-dependencies]
# `compiler_setup`, which the tests of what a build refuses open.
coven-schema = { workspace = true, features = ["compiler"] }
proc-macro2.workspace = true
syn.workspace = true
coven-crypto = { workspace = true, features = ["test-utils"] }
coven-merge = { workspace = true, features = ["test-utils"] }
coven-format = { workspace = true, features = ["test-utils"] }
coven-foundation = { workspace = true, features = ["test-utils"] }
# coven-database's tests read sqlive's statement profiles, so only these
# tests turn on its profiles feature.
sqlive = { workspace = true, features = ["test-utils", "profiles"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "fs"] }

[lints]
workspace = true

[[test]]
name = "sequence_claims"
required-features = ["test-utils"]

[[test]]
name = "sequence_rules"
required-features = ["test-utils"]

[[test]]
name = "temporary_storage"
required-features = ["test-utils"]

[[test]]
name = "insert_cost"
required-features = ["test-utils"]

[[test]]
name = "bulk_write_cost"
required-features = ["test-utils"]
