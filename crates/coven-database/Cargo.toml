[package]
name = "coven-database"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-utils = ["coven-format/test-utils"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
coven-crypto.workspace = true
coven-foundation.workspace = true
coven-merge.workspace = true
coven-format.workspace = true
rusqlite = { workspace = true, features = ["bundled", "session", "hooks", "preupdate_hook", "functions", "limits", "blob", "collation"] }
sqlite3-parser.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "io-util"] }
uuid.workspace = true

[dev-dependencies]
proc-macro2.workspace = true
syn.workspace = true
coven-merge = { workspace = true, features = ["test-utils"] }
coven-format = { workspace = true, features = ["test-utils"] }
rusqlite = { workspace = true, features = ["trace"] }
coven-foundation = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "fs"] }

[lints]
workspace = true

[[test]]
name = "sequence_claims"
required-features = ["test-utils"]

[[test]]
name = "sequence_rules"
required-features = ["test-utils"]
