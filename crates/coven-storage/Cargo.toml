[package]
name = "coven-storage"
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
description = "Coven's cloud homes: object layout, at-rest protection, and the OAuth flows that reach them"
repository = "https://github.com/bae-fm/coven"
readme = "../../README.md"

[lib]
name = "coven_storage"
path = "src/lib.rs"

[dependencies]
coven-foundation = { workspace = true }
coven-keys = { workspace = true }
coven-protocol = { workspace = true }

async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sts = { workspace = true }
aws-smithy-http-client = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
open = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
keyring-core = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
# A `cfg(test)` build of this crate reaches the foundation, keys, and protocol
# test hooks, which exist only under those crates' own `test-utils`. `cfg(test)`
# enables no `[features]` of this crate, so they arrive through these edges.
coven-foundation = { workspace = true, features = ["test-utils"] }
coven-keys = { workspace = true, features = ["test-utils"] }
coven-protocol = { workspace = true, features = ["test-utils"] }

[features]
# The in-memory cloud home the layers above build their storage tests from,
# together with the cipher and setup helpers those tests construct.
test-utils = ["coven-protocol/test-utils"]
# The OAuth authorization flow and the providers reached through it.
oauth-providers = ["dep:open", "coven-keys/oauth-providers"]

[lints]
workspace = true
