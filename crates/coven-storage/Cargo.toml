[package]
name = "coven-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coven-foundation.workspace = true
coven-crypto.workspace = true
coven-format.workspace = true
coven-merge.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "macros", "process"] }
url = { workspace = true, features = ["serde"] }
uuid.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
http.workspace = true
http-body.workspace = true
bytes.workspace = true
oauth2.workspace = true
open.workspace = true
aws-sdk-s3 = { workspace = true, features = ["rt-tokio"] }
aws-credential-types.workspace = true
aws-smithy-async.workspace = true
aws-smithy-runtime-api = { workspace = true, features = ["client", "http-1x"] }
hex.workspace = true
base64.workspace = true
xmlparser.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSOperation", "NSPredicate", "NSString", "NSURL", "NSDate", "NSValue"] }
objc2-cloud-kit = { workspace = true, features = ["std", "block2", "CKAcceptSharesOperation", "CKAsset", "CKContainer", "CKDatabase", "CKDatabaseOperation", "CKError", "CKFetchRecordsOperation", "CKFetchRecordZonesOperation", "CKFetchShareMetadataOperation", "CKFetchShareParticipantsOperation", "CKModifyRecordsOperation", "CKModifyRecordZonesOperation", "CKOperation", "CKQuery", "CKQueryOperation", "CKRecord", "CKRecordID", "CKRecordZone", "CKRecordZoneID", "CKReference", "CKShare", "CKShareMetadata", "CKShareParticipant", "CKUserIdentity", "CKUserIdentityLookupInfo"] }

[dev-dependencies]
coven-format = { workspace = true, features = ["test-utils"] }
coven-foundation = { workspace = true, features = ["test-utils"] }
coven-crypto = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
axum.workspace = true
futures-util.workspace = true
tempfile.workspace = true
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[features]
test-utils = ["coven-foundation/test-utils"]

[lints]
workspace = true
