name: rules review (matrix)

# Thin caller for the shared per-rule matrix reviewer
# (agent-instructions/.github/workflows/rules-review.yml). Manual dispatch.
# The reusable workflow discovers applicable rules from each rule's `paths`
# frontmatter; coven is pure Rust so SwiftUI/Kotlin/TS rules auto-skip.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN secret on this repo (or the org).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      checkout_ref:
        description: "coven ref to check out (PR head SHA)"
        required: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: hideselfview/agent-instructions/.github/workflows/rules-review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      checkout_ref: ${{ inputs.checkout_ref }}
      project: coven
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
