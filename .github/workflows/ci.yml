name: ci

# One script runs every check of Appendix F.6: its code checks on every platform,
# and the Lean proofs once, on Linux, since a proof checks the same anywhere.
# Spec edits alone don't run it, so they never cancel a run checking code.
on:
  push:
    branches: [main]
    paths: &code_paths
      - "crates/**"
      - "tools/**"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - "spec/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *code_paths

concurrency:
  group: ci-${{ github.ref }}
  # A main run always finishes; GitHub still replaces a waiting run with the newest.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# nextest gives each test a fresh process, whose glibc malloc starts with its
# smallest trim threshold: a test allocating and freeing large buffers then
# returns pages to the kernel on nearly every free and faults them back in.
# coven-format's mutation tests spent most of their time there (about 45 of
# 107 seconds in a Linux container, and over 400 on a runner). Never trimming
# keeps that memory in the process; no test measures the process's resident
# size. Other platforms' allocators ignore this.
env:
  GLIBC_TUNABLES: glibc.malloc.trim_threshold=1073741824:glibc.malloc.mmap_threshold=33554432

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # coven-format's pinned-bytes test reruns its Python fixture generator,
      # which seals with libsodium (D14). That test is left out on Windows.
      - name: Install libsodium
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y libsodium23
          else
            brew install libsodium
          fi
      # The pinned toolchain and components come from rust-toolchain.toml on
      # the first cargo invocation.
      #
      # Most of the build is the workspace's own crates, which every commit
      # changes. The whole target directory, with their incremental state, is
      # saved after each run and restored from the latest one with the same
      # manifests and toolchain, so rustc recompiles only what changed. A
      # checkout's fresh timestamps make cargo rerun rustc on every workspace
      # crate, which is why incremental state and not the artifacts alone is
      # what makes the next build short. (Swatinem/rust-cache keeps
      # dependencies only, under a key that never changes, and turns
      # incremental compilation off.)
      - name: Restore the build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - name: scripts/check.sh code
        run: scripts/check.sh code

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coven-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml') }}
      # elan reads each proof's lean-toolchain the first time lake runs there;
      # the cache keeps those toolchains. The proofs themselves are built from
      # scratch every run (scripts/check.sh).
      - name: Restore elan and the Lean toolchains
        id: elan-cache
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('spec/proofs/*/lean-toolchain') }}
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --no-modify-path --default-toolchain none
          rm elan-init.sh
      - name: Put elan on the path
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: scripts/check.sh proofs
        run: scripts/check.sh proofs
