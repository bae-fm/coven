name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The pinned toolchain and components come from rust-toolchain.toml on the
      # first cargo invocation.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: profile-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-workspace-crates: true
      # rust-cache preserves dependency artifacts but deliberately exports
      # CARGO_INCREMENTAL=0 and removes incremental state. Coven's test build is
      # dominated by recompiling workspace and integration-test crates, so
      # restore the profile's setting and retain their compiler state separately.
      - name: Enable incremental compilation
        run: echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"
      - name: Restore coven incremental compiler state
        uses: actions/cache@v5
        with:
          path: target/debug/incremental
          key: coven-incremental-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            coven-incremental-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Restricted-path Rust visibility
        run: scripts/check-rust-visibility.sh
      - name: Owner construction and capability boundaries
        run: scripts/check-owner-boundaries.sh
      - name: No new #[allow(dead_code)]
        # dead_code is denied workspace-wide (see Cargo.toml); an `allow` here
        # is a silent, permanent way back around that deny at the item it
        # decorates. The lint is almost always right — delete the item, or
        # narrow its visibility so the compiler actually knows who calls it.
        # The rare item kept alive for a reason the compiler can't see (e.g.
        # a `Drop` guard field never read) should say so in a doc comment
        # next to the allow, not appear silently.
        run: |
          if grep -rnE '#!?\[allow\([^)]*dead_code\b' crates --include='*.rs'; then
            echo "::error::New #[allow(dead_code)] found above — fix the root cause instead of silencing the lint."
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Lib-only check (production feature sets, no test cfg)
        run: scripts/check-lib-only.sh
      - name: Compile unit and integration tests
        run: cargo test --all-features --no-run --timings
      - name: Upload test compilation timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-test-timings-linux
          path: target/cargo-timings
          if-no-files-found: warn
          retention-days: 14
      - name: Run tests and doctests
        run: cargo test --all-features

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: profile-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-workspace-crates: true
      - name: Clippy
        run: cargo clippy -p coven --all-targets --all-features -- -D warnings
      # dead_code coverage is per-platform now that the durable-write helpers
      # have #[cfg(unix)] / #[cfg(not(unix))] arms: an item left dead only on
      # the non-Unix arm is invisible to the Linux run.
      - name: Lib-only check (production feature sets, no test cfg)
        shell: bash
        run: scripts/check-lib-only.sh
      # This should run `cargo test --all-features`, the way the Linux job does.
      # Running only one integration test is how ten copies of a POSIX-only
      # directory fsync compiled here at every push without once executing.
      #
      # The full run is not green yet, and the reason is a second Windows defect
      # rather than anything POSIX-only about the tests: `ConnectionThread::drop`
      # detaches the SQLite worker thread when it runs inside a tokio runtime
      # instead of joining it, so the connection is still open when a staged
      # snapshot image is deleted. Unlinking an open file is fine on POSIX and
      # is `ERROR_SHARING_VIOLATION` (os error 32) here, which fails 15 tests
      # across joining, restoration, Circle rotation, and snapshot bootstrap.
      # Those tests are not gated off, because they are reporting a real bug —
      # closing the connection deterministically before the delete is the fix,
      # and this line becomes `cargo test --all-features` with it.
      - name: Windows keyring store round-trip
        run: cargo test -p coven --all-features --test windows_keyring

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: profile-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-workspace-crates: true
      - name: Clippy
        run: cargo clippy -p coven --all-targets --all-features -- -D warnings
      - name: Apple protected-store entry construction
        run: cargo test -p coven --all-features --test apple_keyring
