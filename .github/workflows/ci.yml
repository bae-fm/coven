name: ci

on:
  pull_request:

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Restore the build
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: probe
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test -p coven-foundation -p coven-database --lib probe_races -- --nocapture --test-threads=1
