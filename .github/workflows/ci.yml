name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain (1.92.0 + rustfmt/clippy) comes from rust-toolchain.toml on the
      # first cargo invocation.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p coven --all-targets --all-features -- -D warnings
      - name: Windows keyring store round-trip
        run: cargo test -p coven --all-features --test windows_keyring

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p coven --all-targets --all-features -- -D warnings
      - name: Apple protected-store entry construction
        run: cargo test -p coven --all-features --test apple_keyring
