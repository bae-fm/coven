name: wasm

# Browser crate build (wasm32-unknown-unknown).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain (1.95.0) comes from rust-toolchain.toml on the first cargo
      # invocation; that file also lists wasm32-unknown-unknown, but add it
      # explicitly so this job is self-describing and survives a toolchain edit.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check (wasm32-unknown-unknown)
        run: scripts/check-wasm.sh
      - name: Build package
        run: scripts/build-wasm-pkg.sh --check
