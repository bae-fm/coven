# The from-scratch coven of plans/coven-from-scratch.md. A workspace of its own:
# the root workspace excludes this directory and keeps building the coven bae
# ships, unchanged.
[workspace]
resolver = "2"
members = ["crates/coven-foundation", "crates/coven-crypto", "crates/coven-merge", "crates/coven-format", "crates/coven-database", "crates/coven-storage", "crates/coven-sync", "crates/coven", "tools/owner-construction-check"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# One version per external dependency for the whole workspace (§21.1). Members
# name these with `workspace = true` and the features they need; they never
# restate a version. The checker refuses a member dependency that does.
[workspace.dependencies]
coven-foundation = { path = "crates/coven-foundation" }
coven-crypto = { path = "crates/coven-crypto" }
coven-merge = { path = "crates/coven-merge" }
coven-format = { path = "crates/coven-format" }
coven-database = { path = "crates/coven-database" }
coven-storage = { path = "crates/coven-storage" }
coven-sync = { path = "crates/coven-sync" }
rusqlite = "0.40.2"
sqlite3-parser = "0.17.0"
async-trait = "0.1.92"
tokio = "1.53.2"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false }
oauth2 = { version = "5.0.0", default-features = false }
open = "5.4.4"
axum = "0.8.9"
aws-sdk-s3 = { version = "1.152.0", default-features = false }
aws-credential-types = "1.3.0"
aws-smithy-async = "1.3.0"
argon2 = { version = "0.6.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
subtle = "2.6.1"
sha2 = { version = "0.11.0", default-features = false }
zeroize = "1.9.0"
keyring-core = "1.0.0"
apple-native-keyring-store = "1.0.2"
android-native-keyring-store = "1.0.0"
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = "1.0.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.3", features = ["full", "visit"] }
thiserror = "2.0"
toml = "1.1"
uuid = "1.27.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tracing = "0.1.44"
windows-sys = "0.61.2"
rustix = "1.1.5"

[workspace.lints.rust]
# Every `pub` not reachable from the crate's own root must be `pub(crate)` or
# narrower (§21.3). `pub` silences `dead_code` unconditionally, so this is also
# what lets an unused internal item show up as dead.
unreachable_pub = "deny"
dead_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
# Composition roots and owner constructors take their collaborators by name
# (§21.2), so long argument lists are the intended shape there.
too_many_arguments = "allow"
new_without_default = "allow"
# Error enums carry their causes inline so callers match them without
# indirection (§21.3).
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev]
# Checkouts build into one shared target dir through sccache, which cannot
# cache incremental compiles; incremental state only grows that dir.
incremental = false
# Line tables keep backtraces' file:line and keep every rlib small, which is
# what stops a shared target dir from filling a disk when several checkouts
# build. Local-variable inspection under lldb is what this gives up.
debug = "line-tables-only"

[profile.test]
incremental = false
opt-level = 1
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 3
