[package]
name = "coven-storage"
version.workspace = true
edition.workspace = true

[dependencies]
coven-foundation.workspace = true
coven-crypto.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "macros"] }
url = { workspace = true, features = ["serde"] }
uuid.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
oauth2.workspace = true
open.workspace = true
aws-sdk-s3 = { workspace = true, features = ["rt-tokio", "default-https-client", "rustls"] }
aws-credential-types.workspace = true
aws-smithy-async.workspace = true

[dev-dependencies]
coven-foundation = { workspace = true, features = ["test-utils"] }
coven-crypto = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
axum.workspace = true
tempfile.workspace = true

[features]
test-utils = []

[lints]
workspace = true
