# One list for owner construction, runtime acquisition and background work starts.
# Owner constructors include their private representations; names grant no
# exemption.
[composition_roots]
"crates/coven-foundation/src/files/atomic_file.rs" = ["FileWriter::run"]
# A batch's flush syncs its folders and the drive's cache on a blocking
# task, which the write waits for before its commit.
"crates/coven-foundation/src/files/flush_batch.rs" = ["FlushBatch::flush"]
# Runs its caller's work on a blocking task and waits for it, so the work's
# panic comes back to the caller as a value (api.md E15). Starts a worker
# its caller keeps and stops, whose panic goes to the app's bug sink; and
# work its caller may stop waiting for, whose panic then goes there.
"crates/coven-foundation/src/task.rs" = ["blocking", "spawn_owned", "spawn_completing"]
# A test clock that keeps time by the clock it is given and records what one
# progress watch holds at each reading.
# The work one test measures, shared by its task and the blocking calls it
# binds; the measurement in effect, and the one it replaced, are tasks.
"crates/coven-foundation/src/test_work.rs" = [
    "Counter::new",
    # The measurement in effect on this thread, which the scopes a test
    # enters set and put back: its scope is the thread.
    "ACTIVE",
]
"crates/coven-foundation/src/progress.rs" = [
    "RecordingClock::new",
    # Where an owner reports each run of one kind of operation, made with
    # that owner.
    "ProgressChannel::new",
    # A test's recording clock takes the watch it records once the work it
    # times exists.
    "RecordingClock::watch_progress",
]
"crates/coven-foundation/src/files/bootstrap.rs" = [
    "reserve_bootstrap_directory",
    # One bootstrap's hold on its lock, which only that bootstrap keeps.
    "BootstrapLease::new",
]
# One watch of the device's network per open store, which its follower
# keeps and stops as the store closes (§6.7); a test's network, which the
# test drives, and the state each turns what it hears into.
