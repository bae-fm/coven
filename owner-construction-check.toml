"crates/coven/src/coven.rs" = [
    "Coven::new",
    "Coven::builder",
    "Coven::storage_config",
    "Coven::discard_store",
]
# Recovery discovery and forgetting scope the installation's keychain to each
# store's entries.
"crates/coven/src/saved_restore.rs" = ["list", "forget"]
"crates/coven/src/handle.rs" = ["CovenHandle::close", "CovenHandle::new"]
"crates/coven/src/read_handle.rs" = ["CovenReadHandle::close", "CovenReadHandle::new"]
"crates/coven/src/storage.rs" = [
    # Made once per opened installation, beside its sequence state.
    "Publications::new",
    # A completed sign-in becomes this session's custody.
    "StorageConnections::authenticate",
    "StorageConnections::call",
    "StorageConnections::new",
    "StorageConnections::close_live",
    # Setup, unlocking, starting and loading compose a connection's sequence
    # owner, loop and credential owner at runtime.
    "StorageConnections::attach",
    "StorageConnections::sequence",
    "StorageConnections::activate",
    "StorageConnections::setup_connection",
    "StorageConnections::forget_store_keys",
]
# A started loop's connection attempts outlive the start call; close stops
# and awaits them. Stopping releases the client after the pass.
"crates/coven/src/storage_control.rs" = ["StorageConnections::start", "StorageConnections::stop"]
"crates/coven/src/test_utils.rs" = [
    # An installation for a test, with an in-memory keychain and a network the
    # test drives.
    "Coven::testing",
    "Coven::create_closed_store",
    "Coven::keep_store_keys",
    # Deleting one store's credentials reaches its device-only entries, as a
    # person deleting the keychain entry by hand does.
    "Coven::lose_storage_credentials",
    "Coven::in_memory",
    # Another of the person's devices shares only the person entries.
    "Coven::another_device",
    # An Android phone keeps the person entries in Block Store, and a new
    # phone set up from it receives a copy of them.
    "Coven::with_block_store",
    "Coven::set_up_new_device",
    "Coven::restore_new_device_from_cloud",
]

# These methods derive a scoped capability from their injected directory.
# They do not acquire an unrelated directory or file for another owner.
[capability_factories."crates/coven-foundation/src/files/layout.rs"]
"StoreDirectories::store_dir" = "StoreDir"
"StoreDirectories::create_store_dir" = "StoreDir"

[capability_factories."crates/coven-foundation/src/files/bootstrap.rs"]
"BootstrapStore::directory" = "StoreDir"

[capability_factories."crates/coven-foundation/src/files/replacement.rs"]
"ReplacementStore::directory" = "StoreDir"

[capability_factories."crates/coven-foundation/src/files/atomic_file.rs"]
"AtomicFile::open_reader" = "FileReader"

[capability_factories."crates/coven-foundation/src/files/directory.rs"]
"StoreDir::lock_read_only" = "StoreReadLock"
"StoreDir::lock_exclusive" = "StoreLock"
"StoreDir::lock_for_open" = "StoreLock"
"StoreDir::owned_file" = "AtomicFile"
"StoreDir::file" = "AtomicFile"

[[background_starts]]
kind = "runtime construction"
paths = ["Runtime::new", "Builder::new_current_thread", "Builder::new_multi_thread"]

[[background_starts]]
kind = "ambient runtime acquisition"
paths = ["Handle::current", "Handle::try_current"]

[[background_starts]]
kind = "thread or future spawn"
paths = ["tokio::spawn", "task::spawn", "task::spawn_blocking", "task::spawn_local", "thread::spawn"]
methods = ["spawn", "spawn_blocking", "spawn_local"]

# Appendix F.2's table: each capability, the paths the spec assigns it, and
# what using it directly looks like.

[[capabilities]]
name = "network"
homes = ["crates/coven-storage/src/providers/"]

[[capabilities.gates]]
kind = "CloudKit framework"
crates = ["objc2_cloud_kit"]

[[capabilities.gates]]
kind = "HTTP client (reqwest)"
crates = ["reqwest"]

[[capabilities.gates]]
kind = "HTTP server (axum)"
crates = ["axum"]

[[capabilities.gates]]
kind = "AWS SDK"
crates = [
    "aws_config",
    "aws_sdk_s3",
    "aws_sdk_sts",
    "aws_credential_types",
    "aws_smithy_http_client",
    "aws_smithy_runtime_api",
    "aws_smithy_types",
    "smithy_transport_reqwest",
]

[[capabilities.gates]]
kind = "browser opener (open)"
crates = ["open"]

[[capabilities.gates]]
kind = "sockets"
paths = ["std::net", "tokio::net"]

[[capabilities]]
name = "network state"
homes = [
    "crates/coven-foundation/src/network_watch.rs",
    "crates/coven-foundation/src/network_watch_apple.rs",
    "crates/coven-foundation/src/network_watch_android.rs",
    "crates/coven-foundation/src/network_watch_default.rs",
    "crates/coven-foundation/src/network_watch_windows.rs",
    "crates/coven-foundation/src/network_watch_linux.rs",
]

[[capabilities]]
name = "cryptography"
homes = ["crates/coven-crypto/src/"]

[[capabilities.gates]]
kind = "signing keys (ed25519-dalek)"
crates = ["ed25519_dalek"]

[[capabilities.gates]]
kind = "sealed-box keys (crypto_box / x25519-dalek)"
crates = ["crypto_box", "x25519_dalek"]

[[capabilities.gates]]
kind = "AEAD cipher (chacha20poly1305)"
crates = ["chacha20poly1305"]

[[capabilities.gates]]
kind = "key derivation (hkdf / argon2)"
crates = ["hkdf", "argon2"]

[[capabilities.gates]]
kind = "keyed hashes (hmac / sha2)"
crates = ["hmac", "sha2"]

[[capabilities.gates]]
kind = "randomness"
crates = ["rand", "rand_core", "getrandom"]
paths = ["OsRng", "thread_rng", "ThreadRng"]

[[capabilities]]
name = "SQLite"
homes = ["crates/coven-database/src/"]

[[capabilities.gates]]
kind = "SQLite library (rusqlite / libsqlite3-sys)"
crates = ["rusqlite", "libsqlite3_sys"]

[[capabilities]]
name = "OS keychain"
homes = ["crates/coven-crypto/src/custody/"]

[[capabilities.gates]]
kind = "platform keychain"
crates = [
    "keyring",
    "keyring_core",
    "apple_native_keyring_store",
    "android_native_keyring_store",
    "windows_native_keyring_store",
    "zbus_secret_service_keyring_store",
    "security_framework",
]

[[capabilities]]
name = "current time"
homes = ["crates/coven-foundation/src/clock.rs"]

[[capabilities.gates]]
kind = "system clock"
paths = [
    "SystemTime::now",
    "Instant::now",
    "Utc::now",
    "Local::now",
    "OffsetDateTime::now_utc",
    "OffsetDateTime::now_local",
    "tokio::time",
    "thread::sleep",
    "thread::sleep_until",
]

# Only generation is gated: parsing and validating an id is a deterministic
# transformation any module may perform.
[[capabilities]]
name = "new ids"
homes = ["crates/coven-foundation/src/id_source.rs"]

[[capabilities.gates]]
kind = "id generation (uuid)"
paths = ["Uuid::new_v4", "Uuid::new_v7", "Uuid::now_v7"]

[[capabilities]]
name = "files on disk"
homes = ["crates/coven-foundation/src/files/"]

[[capabilities.gates]]
kind = "filesystem"
crates = ["tempfile"]
paths = [
    "std::fs",
    "tokio::fs",
    "unix::fs",
    "windows::fs",
    "rustix::fs",
    "windows_sys::Win32::Storage::FileSystem",
]
