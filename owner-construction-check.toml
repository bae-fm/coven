"crates/coven/src/coven.rs" = [
    "Coven::new",
    "Coven::builder",
    "Coven::storage_config",
    "Coven::discard_store",
    # Listing finishes each deletion a cut call left recorded, with the
    # store's own entries.
    "Coven::stores",
    # Each runs its keychain or directory work on the blocking pool to its
    # end, even once its caller stops waiting; then its bug goes to the
    # app's sink (E15).
    "Coven::read_listed",
    "Coven::saved_restore_codes",
    "Coven::forget_saved_restore_code",
    # Reads a closed store under its writer lock, with the store's own
    # entries, its keychain work on the blocking pool (api.md E1).
    "Coven::closed_sync_status",
    "finish_deletion",
]
# Recovery discovery and forgetting scope the installation's keychain to each
# store's entries.
"crates/coven/src/saved_restore.rs" = ["list", "forget"]
"crates/coven/src/handle.rs" = [
    "CovenHandle::close",
    "CovenHandle::new",
    "CovenHandle::operation_outcome",
]
# Leaving a store runs in a task of its own that finishes even if the app
# stops waiting: past its removal's journal it only goes forward (§11.6).
# Its record and the store's deletion run on the blocking pool to their end,
# then their bug goes to the app's sink (E15).
"crates/coven/src/handle_delete.rs" = [
    "CovenHandle::leave",
    "CovenHandle::leaving",
    "CovenHandle::forget_deletion",
]
# Deleting the discarded installations runs on the blocking pool to its end,
# even once its caller stops waiting; then its bug goes to the app's sink (E15).
"crates/coven/src/handle_discarded_devices.rs" = ["CovenHandle::delete_discarded_devices"]
"crates/coven/src/read_handle.rs" = ["CovenReadHandle::close", "CovenReadHandle::new"]
"crates/coven/src/storage.rs" = [
    # A completed sign-in becomes this session's custody.
    "StorageConnections::authenticate",
    "StorageConnections::call",
    "StorageConnections::new",
    "StorageConnections::close_live",
    # Setup, unlocking, starting and loading compose a connection's sequence
    # owner and loop at runtime.
    "StorageConnections::attach",
    "StorageConnections::sequence",
    "StorageConnections::activate",
    "StorageConnections::forget_store_keys",
    # A connection's storage, built through its connector.
    "StorageConnections::connect_with",
]
# An access key's check connects its storage, and a connected store's
# sequence owner reconnects through it.
"crates/coven/src/storage_operations.rs" = ["StorageConnections::use_access_key"]
# Setup connects and composes the candidate's sequence owner; a setup a crash
# cut past its point of no return connects with the credentials it kept, in a
# sign-in of this session's (§11.6).
# Undoing a cut setup's local state runs on the blocking pool to its end
# (E15).
"crates/coven/src/storage_setup.rs" = [
    "StorageConnections::setup_connection",
    "StorageConnections::resume_setup",
    "settle_opened",
]
# Reclaiming or discarding an unfinished installation runs on the blocking pool
# to its end, discarding with the entries it composes for the store (E15).
"crates/coven/src/bootstrap_unfinished.rs" = [
    "kept",
    "CovenBuilder::discard_unfinished_installation",
]
# A started loop's connection attempts outlive the start call; close stops
# and awaits them. Stopping releases the client after the pass.
"crates/coven/src/storage_control.rs" = [
    "StorageConnections::start",
    "StorageConnections::start_locked",
    "StorageConnections::stop",
]
# Each attempt is its own task, marked on the file layer while it lives.
"crates/coven/src/storage_attempt.rs" = ["StorageConnections::start_attempt"]

# These methods derive a scoped capability from their injected directory.
# They do not acquire an unrelated directory or file for another owner.
[capability_factories."crates/coven-foundation/src/files/layout.rs"]
"StoreDirectories::store_dir" = "coven_foundation::files::directory::StoreDir"

[capability_factories."crates/coven-foundation/src/files/bootstrap.rs"]
"BootstrapStore::directory" = "coven_foundation::files::directory::StoreDir"

[capability_factories."crates/coven-foundation/src/files/replacement.rs"]
"ReplacementStore::directory" = "coven_foundation::files::directory::StoreDir"

[capability_factories."crates/coven-foundation/src/files/atomic_file.rs"]
"AtomicFile::open_reader" = "coven_foundation::files::file_reader::FileReader"

[capability_factories."crates/coven-foundation/src/files/observed_file.rs"]
"UserOriginal::open_reader" = "coven_foundation::files::file_reader::FileReader"

[capability_factories."crates/coven-foundation/src/files/folder_copy.rs"]
"CopyFolder::clone_handle" = "coven_foundation::files::folder_copy::CopyFolder"

[capability_factories."crates/coven-foundation/src/files/directory.rs"]
"StoreDir::rebuild_directory" = "coven_foundation::files::directory::StoreDir"
"StoreDir::lock_read_only" = "coven_foundation::files::lock::StoreReadLock"
"StoreDir::lock_for_open" = "coven_foundation::files::lock::StoreLock"
"StoreDir::lock_closed" = "coven_foundation::files::lock::ClosedStoreLock"
"StoreDir::owned_file" = "coven_foundation::files::atomic_file::AtomicFile"
"StoreDir::file" = "coven_foundation::files::atomic_file::AtomicFile"
"StoreDir::writer_folder" = "coven_foundation::files::atomic_file::WriterFolder"
"StoreDir::staged_file" = "coven_foundation::files::atomic_file::AtomicFile"
"StoreDir::staging_folder" = "coven_foundation::files::atomic_file::WriterFolder"

[[background_starts]]
kind = "runtime construction"
paths = ["Runtime::new", "Builder::new_current_thread", "Builder::new_multi_thread"]

[[background_starts]]
kind = "ambient runtime acquisition"
paths = ["Handle::current", "Handle::try_current"]

[[background_starts]]
kind = "thread or future spawn"
paths = ["tokio::spawn", "task::spawn", "task::spawn_blocking", "task::spawn_local", "thread::spawn"]
methods = ["spawn", "spawn_blocking", "spawn_local"]

