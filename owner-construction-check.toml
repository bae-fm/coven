# Handles (F.3): what an owner makes from its own state to be shared. Only
# the owner makes one; it, and the owners holding it, return a fresh one; a
# holder receives it when it is built.
[handles]
# A live query the database makes from its readers and commit observer for
# the app, which keeps it as long as it follows the results (api.md E4).
LiveQuery = "Database"
ReconfigurableLiveQuery = "Database"
# Replaces a live query's request from another task while the query waits
# for its next result (api.md E4).
LiveQueryRequests = "ReconfigurableLiveQuery"
# An app's request for idle passes at most its interval apart, held until it
# drops (api.md E5), and the sync loop's view of the shortest one held.
SyncOftenGuard = "SyncOften"
IdleInterval = "SyncOften"
# Each change of the sync activity, for the file workers waiting until sync
# allows their transfers.
SequenceStatusWatch = "SequenceState"
# The running pass's first move, for the sync loop to write that it moves.
PassMoves = "SequenceState"
# A test's count of the requests the in-memory provider's connections
# attempt, to wait on without polling.
RequestWatch = "MemoryStorage"
# The progress one kind of operation reports, such as a store's open or a
# load from storage, for the host drawing it (api.md E1).
ProgressWatch = "ProgressChannel"
# The answer to the person's retry: how the first pass after it ended
# (api.md E5).
RetryAnswer = "RetryWaits"
# Each network or retry report, for an owner waiting on its own timers
# (§6.7).
NetworkReportWatch = "RetryWaits"
# Each wait a failed attempt arms, so an owner plans again (§6.7).
RearmWatch = "RetryWaits"
# What the store's watch knows of the device's network, for each owner that
# acts on it (§6.7, §17.9).
NetworkView = "NetworkWatch"
# Sync starting and stopping, for the upload worker, which runs only while
# sync is started (§17.4).
SyncingWatch = "RetryWaits"
# The answer to an app's early retry of its uploads (§17.9).
UploadRetryAnswer = "FilesInner"
# One observation of the store's commits, shared by the observer that
# tells it of each and what it watches for (§4).
CommitSubscription = "CommitObserver"
# Commits to the rows a worker waits on, coalesced (§4).
DatabaseChanges = "CommitObserver"
# How far each file in flight one way has got (api.md E7, E8).
TransferWatch = "InFlight"
# The files in flight one way, which the worker moving them marks as each
# attempt starts and ends (§17.8, §17.9).
InFlight = "TransfersInFlight"
# Marks a store closing when its owner's scope ends, without holding its
# lock, so a reopen in this process waits for its release (F.4).
StoreClosingGuard = "LockRegistration"
# The person's iCloud Keychain entries, shared by each in-memory keychain of
# the person: a keychain makes the share for another of the person's devices.
SyncedEntries = "Keychain"
# One input object's reading: every retained input of that object shares it,
# and the input database keeps its bytes while any does.
InputRead = "InputDatabase"

# The raw handles and coven's own SQL are the database boundary's subject;
# the SQLite capability's row names the database's home and the SQLite
# library beneath rusqlite.
[database]
capability = "SQLite"
schema = "crates/coven-database/src/internal_schema.rs"
table_macros = [
    "coven_tables",
    "coven_ownership_tables",
    "coven_input_tables",
    "coven_sequence_tables",
    "coven_claim_tables",
    "coven_published_tables",
    "coven_store_state_tables",
    "coven_authorship_tables",
    "coven_sequence_application_tables",
    "coven_write_headers_tables",
    "coven_written_values_tables",
    "coven_SQL_versions_tables",
    "coven_source_names_tables",
    "coven_write_boundaries_tables",
    "coven_retries_tables",
    "coven_uploads_tables",
    "coven_device_reset_tables",
    "coven_file_columns_tables",
    "coven_pin_requests_tables",
    "coven_file_moves_tables",
    "coven_data_reloads_tables",
    "coven_conversion_schemas_tables",
    "coven_migration_prefix_tables",
    "coven_owner_tables_tables",
    "coven_device_only_copies_tables",
    "coven_file_protection_tables",
    "coven_writes_tables",
    "coven_operations_tables",
    "coven_file_uploads_tables",
    "coven_applied_sequence_tables",
    "coven_file_retention_tables",
    "coven_ended_requests_tables",
    "coven_raises_tables",
    "coven_object_removals_tables",
    "coven_provider_access_tables",
    "coven_pending_tables",
    "coven_migration_losses_tables",
    "coven_user_originals_tables",
    "coven_file_removals_tables",
]
# The API re-exports the database crate's `rusqlite` so a host can name the
# types its own SQL uses.
rusqlite_reexport = "coven-database"

# Appendix F.2: the database's tables by the module that writes them. SQL
# anywhere may read a table; only its domain's homes write it, in a statement
# or a trigger's body, create it and its indexes, and hold the tests that
# write it. Each domain names the owner that does its work. The tables no one
# module writes form the database's own domain, which every module of
# coven-database writes.

[[database.domains]]
name = "sequence claims"
owner = "Database"
homes = ["crates/coven-database/src/claim.rs", "crates/coven-database/src/claim_schema.rs"]
tables = [
    "_coven_claim_attempts",
    "_coven_claim_chunks",
    "_coven_claim_counters",
    "_coven_claim_journal",
    "_coven_upload_claims",
]

