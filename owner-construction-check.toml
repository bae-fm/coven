# coven's policy for the structural checker (tools/owner-construction-check,
# Appendix F.3 and F.6): the rules it runs and every name they read about this
# workspace. The checker fails when a row names a member, file, type or
# callable the workspace does not hold.

rules = [
    "crate-dependencies",
    "capability-boundaries",
    "database-boundary",
    "owner-dependencies",
    "retained-capability-parameters",
    "component-bundles",
    "capability-construction",
    "typed-errors",
    "conventions",
]

# The checker, and the policy model it shares with the typed lints, answer
# only to the conventions.
tools = ["owner-construction-policy", "owner-construction-check"]

# These are the features only tests turn on.
test_support_features = ["test-utils", "in-memory-keychain", "profiles"]

# coven re-exports the API at its root and keeps every module private (F.5).
api_crate = "coven"

# Appendix F.1: the crates in dependency order.
crate_order = [
    "windows-reserved-names",
    "panic-as-error",
    "sqlive-reads",
    "sqlive",
    "sqlive-compose-macros",
    "sqlive-compose",
    "coven-foundation",
    "coven-crypto",
    "coven-merge",
    "coven-format",
    "coven-schema",
    "coven-database",
    "coven-storage",
    "coven-sync",
    "coven",
]
separated_crates = [["coven-database", "coven-storage"]]

# These are the leaf capabilities. Owners retaining them receive them
# through constructors; their implementations keep raw OS handles private.
capability_types = [
    "coven_foundation::clock::Clock",
    "coven_foundation::clock::ClockRef",
