# coven's policy for the structural checker (tools/owner-construction-check,
# Appendix F.3 and F.6): the rules it runs and every name they read about this
# workspace. The checker fails when a row names a member, file, type or
# callable the workspace does not hold.

rules = [
    "crate-dependencies",
    "capability-boundaries",
    "database-boundary",
    "owner-dependencies",
    "retained-capability-parameters",
    "component-bundles",
    "capability-construction",
    "conventions",
]

# The checker itself answers only to the conventions.
tools = ["owner-construction-check"]

# coven re-exports the API at its root and keeps every module private (F.5).
api_crate = "coven"

# Appendix F.1: the crates in dependency order.
crate_order = [
    "coven-foundation",
    "coven-crypto",
    "coven-merge",
    "coven-format",
    "coven-database",
    "coven-storage",
    "coven-sync",
    "coven",
]
separated_crates = [["coven-database", "coven-storage"]]

# These are the leaf capabilities. Owners retaining them receive them
# through constructors; their implementations keep raw OS handles private.
capability_types = [
    "Clock",
    "ClockRef",
    "SystemClock",
    "IdSource",
    "IdSourceRef",
    "UuidIds",
    "StoreDirectories",
    "BootstrapStore",
    "ReplacementStore",
    "StoreDir",
    "AtomicFile",
    "FileWriter",
    "FileReader",
    "AssetFiles",
    "AssetFile",
    "StoreLock",
    "StoreReadLock",
    "StoreDeletionLock",
    "Keychain",
    "StoreKeychain",
    "PersonEntries",
    "KeyringCustody",
    "StoreKeyCustody",
    "MemberKeyCustody",
    "CustodyPersistence",
    "StorageConnector",
    "Storage",
    "ProviderOps",
    "OAuthClients",
    "OAuthPresenter",
    "OAuthSession",
    "DatabaseConnection",
    # The reqwest client every HTTPS request goes through, with the clock its
    # stall window is timed by (§6.7, F.1): the provider connector holds one
    # and the sign-in exchange another, each built where its holder is.
    "HttpClient",
]
# Shared in-memory state (F.2): whoever holds one shares it with the others
# that do, so it is shared on purpose, by an owner, and leaves that owner only
# inside a handle.
shared_state_types = [
    "Barrier",
    "Semaphore",
    "JoinHandle",
    "AtomicBool",
    "AtomicI64",
    "AtomicU64",
    "AtomicUsize",
    "OnceLock",
    "LazyLock",
    "Notify",
    "Sender",
    "UnboundedSender",
    "Receiver",
    "UnboundedReceiver",
]
# A lock is its holder's private state while one owner holds it by value;
# held through a shared pointer or a reference, by itself or inside what is,
# it is shared state.
private_state_types = ["Mutex", "RwLock", "Condvar"]
# Every holder of one of these shares what it points at with the others.
shared_pointer_types = ["Arc", "Rc", "Weak"]
capability_traits = [
    "Clock",
    "IdSource",
    "StoreKeyCustody",
    "MemberKeyCustody",
    "CustodyPersistence",
    "StorageConnector",
    "Storage",
    "ProviderOps",
    "OAuthPresenter",
]
construction_only_capability_types = [
    "AssetFiles",
    "StoreDirectories",
    "FileReader",
    "StoreDir",
    "StoreLock",
    "StoreReadLock",
    "AtomicFile",
    "ClockRef",
    "IdSourceRef",
    "Keychain",
    "StoreKeychain",
    "PersonEntries",
    "OAuthClients",
    "OAuthSession",
    "DatabaseConnection",
    "HttpClient",
]
non_owner_types = [
    # Failure transport may carry a published handle; it does not own store lifetime.
    "BootstrapError",
    "StoreCreationError",
    "KeyCustody",
    "IdentityCustody",
    "Command",
    "Request",
    # What stops a connection's lookups that run too long, shared with
    # that connection's progress handler; it lives with the connection.
    "LookupLimit",
    "LookupState",
]
# An API namespace that borrows an owner without becoming one: a store's
# circles, which the app reaches through its handle.
borrowed_facade_types = ["Circles"]
task_types = [
    # What one S3 detection read from its responses' headers, shared with
    # the interceptor each of its requests carries (§20.7).
    "HeaderCapture",
    # One copy being written under its temporary name in the folder the
    # person picked, whose file its blocking writes share (§17.3).
    "CopyWriter",
    # The measurement in effect on a thread for one scope of a test, and the
    # one it replaced, put back when the scope ends.
    "Active",
    "PreviousActive",
    # What one storage setup call has spent waiting to resend refused
    # requests, which its steps draw on and then the connection it makes for
    # its own requests (§20.8).
    "SetupWaits",
    # How the authorizer judges the SQL of one scope: coven's own, an
    # applied write's, a write's, a bulk write's, one step's or one read's,
    # and the reads one statement makes while it is prepared.
    "InternalSql",
    "ApplyingSql",
    "WriteSql",
    "BulkSql",
    "StepSql",
    "ReadingSql",
    "ObservedReads",
    # A first installation's, and a replacement's, unpublished store and
    # its bootstrap lock, for that one call.
    "BootstrapStore",
    "ReplacementStore",
    "OpenFile",
    "LocalFileReader",
    "LockedWriter",
    # The files one commit records, and each folder they were made in,
    # until the flush before that commit (Appendix C.3).
    "FlushBatch",
    "BatchFolder",
    "CacheReservation",
    # App bytes one staging wrote, until the write that takes them
    # (§17.3).
    "StagedFiles",
    # Whole copies one pin prepared, until the write that keeps them
    # (§17.8), and what preparing found for each file.
    "PreparedPin",
    "PreparedFile",
    # The copies one call making files device-only wrote, until the
    # write that switches them (§17.3).
    "PreparedDeviceOnly",
    # The copies one call making files device-only is writing (§17.3).
    "CopyReservation",
    # One read's body from the in-memory provider, which shares the
    # provider's state to answer the holds a test placed on it.
    "MemoryBody",
    # One request to the in-memory provider, counted among those running
    # until it ends.
    "ActiveMemoryRequest",
    # One change of the files owner's connection, which holds its upload
    # runs until it ends.
    "ConnectionChange",
    "UploadedFile",
    "RetainedInput",
    "ObjectInput",
    "InputStream",
    # One floor observation, snapshot read or upload source.
    "FloorObject",
    "SnapshotObject",
    "ReadSnapshot",
    "SelectedSnapshot",
    # One snapshot's staging: its records, from the first batch of its
    # body to the load or file check that reads them.
    "SnapshotStaging",
    "ReloadStart",
    # One reload's selected streams and installation target.
    "ReloadInputs",
    "ClaimSource",
    "SnapshotUploadSource",
    "FloorUploadSource",
    "FileTransfer",
    "FileRangeStream",
    "LocalFileStream",
    "FileStream",
    # An open file's read position and the read ahead it started, which
    # its stream aborts when dropped.
    "FileStreamState",
    "FileStaging",
    # A read's call on the blocking pool, awaited by its read.
    "RunningRead",
    # A test's follow of one live query's results, while it follows them.
    "Followed",
    # One read's response body, holding that read's place under the
    # store's download limit until it ends (api.md E5).
    "ObjectStream",
    "StreamState",
    "DownloadLease",
    # One snapshot body read, hashing the stream it reads.
    "HashedBody",
    # One CloudKit operation, cancelled if dropped, and the reply its
    # completion sends.
    "CloudKitRequest",
    "CloudKitReply",
    # A test's hold on one request of the in-memory provider, until the
    # test releases it.
    "HeldRead",
    "HeldBody",
    "HeldRequest",
    "HeldAccess",
    # The retry requests one pass took, answered when it ends.
    "PassRequests",
    # An app's early retry of its uploads, waiting for its answer.
    "AppRetry",
    # One operation's wait, and the commits it watches for.
    "Wait",
    # One attempt's commits, from its start until it names the rows its wait
    # depends on (§6.7).
    "AttemptCommits",
    # One write's changes, and each live query's verdict on them, until it
    # commits (§4).
    "Judged",
    # One attempt to transfer a stored object, and what tells it how far it
    # has got.
    "Transferring",
    "TransferMeter",
    # Where one run of a file's chunks goes: the cache, or a pin's whole file.
    "ChunkDestination",
    # One journal stream's bytes, from the committed reader to the claim that
    # sends them, and where that reader sends them.
    "StreamInput",
    "StreamSender",
    # One try at a store's lock: the closing holder it waits for, or the
    # registration it reserved.
    "Acquisition",
    # One migration run's capture of the synced state, the temporary tables
    # holding it, and the rows removal rules hid before it, on the connection
    # the run migrates (§18.1, §18.7).
    "MigrationCapture",
    "MigrationSnapshot",
    "Hidden",
    # The judging of one write: the schema it was authored under, one child
    # row through its steps, the owners of the rows it changes, and where its
    # original records are read, on the connection that judges it (§9.6).
    "Authoring",
    "ChildView",
    "Owners",
    "Originals",
    # One received write's interpretation, admitting its parts on the
    # connection that stages it (§9.5, §9.6).
    "Interpreter",
    # Whether one transaction's materialization has deferred foreign keys on
    # its connection.
    "Deferral",
    # One join's request and the bootstrap file that keeps it, from preparing
    # or resuming the request until the join ends (§13.2).
    "JoiningIdentity",
    # One read's or write's open file, one CloudKit request's asset, and one
    # deletion's locks, which the owner of the store's files makes for that
    # operation.
    "FileReader",
    "FileWriter",
    "AssetFile",
    "StoreDeletionLock",
    # When one HTTP exchange last moved bytes; it lives for that exchange.
    "ExchangeProgress",
    # One long operation's progress reports, paced by the operation's clock.
    "ProgressReport",
    # A cursor over one input object's retained bytes on the input
    # connection, and what one received slot decodes from them: its
    # plaintext, each part's, its body, and the slot itself.
    "RetainedBytes",
    "SlotPlaintext",
    "PartPlaintext",
    "SlotBody",
    "ReceivedSlot",
    # One HTTP exchange's request and response bodies.
    "UploadBody",
    "DownloadBody",
    # One scan of the sequence for the keys of a join or a reload.
    "KeyScan",
    # One join's bootstrap file, one folder request's sign-in, one S3
    # detection's probes and one connection attempt (§13.2, §20.7).
    "Joining",
    "OAuthFolders",
    "Probes",
    "ConnectionAttempt",
    # A database being built for one open or create, which it ends.
    "DatabaseBuilder",
    # One read's, one write's and one transaction's values, each borrowing
    # the connection or the owner it works on for that operation, and the
    # parts they are made of: a merge's row values, a removal view's states
    # and a write's journal for sync's steps.
    "RowValues",
    "States",
    "Journal",
    "SnapshotMetadata",
    # A run of slot reads borrows the sequence owner and hands each slot's
    # bytes to its reader in order.
    "SlotReads",
    # Readers that borrow a connection for one committed read or transaction.
    "DatabaseMetadata",
    "PreparedBytes",
    "PreparedInputs",
    "PreparedRecords",
    "PreparedWrite",
    "PreparedPart",
    "PreparedSnapshot",
    # One batch of a snapshot's staging writes its records through the
    # input connection's transaction for that batch.
    "RecordStaging",
    "ClaimBytes",
    "FileWrite",
    # One write call's files borrow the store's id source and its
    # reservations; each transaction of the call works on them.
    "WriteFiles",
    # A write's batch borrows the store's id source while the app
    # stages its files, giving each a new id.
    "WriteBatch",
    "SqlReadContext",
    "Read",
    "ReadOwner",
    "ChangeCapture",
    "StreamCapture",
    "SupplementalChanges",
    "Observing",
    "MigrationContext",
    "SqlContext",
    # An app's write borrows the store's operation owner, whose steps
    # run in it, for that one transaction.
    "CovenWrite",
    # A bulk write's SQL borrows the writer connection for its one
    # transaction, as a write's does.
    "BulkSqlContext",
    "SqlTransaction",
    # A write transaction holds the writer from BEGIN to its end and sets
    # and removes the hooks that observe it.
    "WriteTransaction",
    "ReaderLease",
    "AppView",
    "MergeStore",
    "WriteMetadata",
    "DatabaseRemovalView",
    "WriteApply",
    # A local write's operation hook and its capture borrow
    # the writer connection for one transaction.
    "EventCapture",
    "Tracker",
    "PreWrite",
    # One read's body, counted in its connection's request totals.
    "CountedBody",
]
