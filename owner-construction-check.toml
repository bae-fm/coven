    "CloudKitRequest",
    "CloudKitReply",
    # A test's hold on one request of the in-memory provider, until the
    # test releases it.
    "HeldRead",
    "HeldBody",
    "HeldRequest",
    "HeldAccess",
    "SqlTransaction",
    "ReaderLease",
    "AppView",
    "MergeStore",
    "WriteMetadata",
    "DatabaseRemovalView",
    "WriteApply",
    # A local write's operation hook, its phases and their capture borrow
