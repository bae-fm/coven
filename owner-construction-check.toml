# One list for owner construction, runtime acquisition and task starts.
# Owner constructors include their private representations; names grant no
# exemption.
[composition_roots]
"crates/coven-foundation/src/files/atomic_file.rs" = ["FileWriter::run"]
# A batch's flush syncs its folders and the drive's cache on a blocking
# task, which the write waits for before its commit.
"crates/coven-foundation/src/files/flush_batch.rs" = ["FlushBatch::flush"]
# Copies into a folder the person picked do their file work on a blocking
# task, which finishes even if the call is dropped (§17.3).
"crates/coven-foundation/src/files/folder_copy.rs" = ["blocking"]
# Runs its caller's work on a blocking task and waits for it, so the work's
# panic comes back to the caller as a value (api.md E15).
"crates/coven-foundation/src/task.rs" = ["blocking"]
# A test clock that keeps time by the clock it is given and records what one
# progress watch holds at each reading.
"crates/coven-foundation/src/progress.rs" = [
    "RecordingClock::new",
    # Where an owner reports each run of one kind of operation, made with
    # that owner.
    "ProgressChannel::new",
    # A test's recording clock takes the watch it records once the work it
    # times exists.
    "RecordingClock::watch_progress",
]
"crates/coven-foundation/src/files/bootstrap.rs" = [
    "reserve_bootstrap_directory",
    # One bootstrap's hold on its lock, which only that bootstrap keeps.
    "BootstrapLease::new",
]
# Both store listings read the directory on a blocking task.
"crates/coven-foundation/src/files/layout.rs" = ["StoreDirectories::listed"]
"crates/coven-foundation/src/files/lock_registry.rs" = [
    # The process's registry of every store's locks: its scope is the
    # process, like the OS file locks it tracks (F.4).
    "STORES",
    "LockRegistration::open_on_worker",
    # Makes each lock's entry in the registry, which its closing guards share,
    # and the registration that keeps it until the lock's file closes.
    "reserve",
    # Waits out a closing holder, then reserves the lock and takes its file.
    "acquire_registered",
    # Takes a lock at once or refuses, for a test.
    "try_acquire",
    # The reserved lock's file, kept with its registration.
    "LockRegistration::acquire_file",
]
# A replacement composes the new installation beside the old one, holding
# the store's writer lock until it is in place.
"crates/coven-foundation/src/files/replacement.rs" = ["begin"]
# A test's id source, which a test hands the builder as it would random ids.
"crates/coven-foundation/src/id_source.rs" = ["SequentialIds::new"]
# A test's clock, which a test hands the builder as it would the system's.
"crates/coven-foundation/src/clock.rs" = ["FixedClock::new"]
# A store's writer or bootstrap lock, taken through the registry.
"crates/coven-foundation/src/files/lock.rs" = [
    "acquire",
    "acquire_for_open",
    "acquire_bootstrap",
    # A deletion's locks, with the bootstrap lock it takes or a bootstrap's
    # lease.
    "for_deletion",
]

"crates/coven-crypto/src/custody/key_session.rs" = [
    "KeySession::open",
    "KeySession::store",
    "KeySession::member",
]
"crates/coven-crypto/src/custody/passphrase.rs" = ["PassphraseCustody::new"]
"crates/coven-crypto/src/custody/store_custody.rs" = ["StoreCustody::new"]
"crates/coven-crypto/src/custody/keychain_test_utils.rs" = [
    # The in-memory keychain's entries, and the person's in iCloud Keychain.
    "Keychain::memory",
    "Keychain::in_memory",
    # Another of the person's devices shares only the person entries.
    "Keychain::another_device",
    # An Android phone keeps the person entries in Block Store, and a new
    # phone set up from it receives a copy of them.
    "Keychain::in_memory_block_store",
    "Keychain::set_up_new_device",
    "Keychain::restore_new_device_from_cloud",
]

# A connection's authorizer, whose state its SQLite hooks share: one judging
# for the handle that holds the writer lock, one for a read-only handle.
"crates/coven-database/src/authorization.rs" = [
    "SqlAuthorization::new",
    "SqlAuthorization::read_only",
    "SqlAuthorization::judging",
]
"crates/coven-database/src/database.rs" = [
    "process",
    "start_call",
    "Database::close",
    "Database::stage_files",
    "DatabaseReadHandle::close",
]
"crates/coven-database/src/database_builder.rs" = [
    "DatabaseBuilder::new",
    "DatabaseBuilder::open",
    "DatabaseBuilder::open_graph",
    "DatabaseBuilder::open_locked",
    "DatabaseBuilder::open_read_graph",
    "DatabaseBuilder::open_read_only",
    "discarded_operations",
    # Name reads open temporary read-only connections at the database boundary.
    "read_store_name",
    "discarded_store_name",
]
"crates/coven-database/src/file_database.rs" = ["FileDatabase::new", "FileDatabase::read_only"]
"crates/coven-database/src/file_staging.rs" = ["FileStaging::write"]
"crates/coven-database/src/local_file.rs" = ["LocalFileStream::read_at"]
"crates/coven-database/src/read_pool.rs" = ["ReadPool::new"]
"crates/coven-database/src/input_database.rs" = ["InputDatabase::new"]
# A reconfigurable live query makes the request state its handles share;
# dropping the query closes it (api.md E4).
"crates/coven-database/src/live_query.rs" = ["ReconfigurableLiveQuery::new"]
# Removes an abandoned snapshot staging's records on a blocking task as it
# drops; closing the store waits for it (§16.2).
"crates/coven-database/src/snapshot_staging.rs" = ["SnapshotStaging::drop"]
# Starts a database's checkpointer task, which the store stops as it closes
# (§4).
"crates/coven-database/src/wal_checkpoints.rs" = ["WalCheckpointer::start"]
# One per open store, which every connection tells of its commits (§4).
"crates/coven-database/src/observation.rs" = [
    "CommitObserver::new",
    # Makes each subscription's state, which its observer reaches by a weak
    # reference.
    "CommitSubscription::new",
]
# One per open store, with each way's shared state, which its handles
# share (§4).
"crates/coven-database/src/transfers_in_flight.rs" = [
    "TransfersInFlight::new",
    "InFlight::new",
]

"crates/coven-storage/src/providers/connector.rs" = [
    "ProviderConnector::with_folders",
    "ProviderConnector::connect",
    "ProviderConnector::new",
    # A connector makes each connection, in every connector.
    "StorageConnector::connect",
]
# One provider's connection, composed once when connecting.
"crates/coven-storage/src/connection.rs" = ["StorageConnection::with_gate"]
# Made once per opened installation and given to every connection and file
# owner.
