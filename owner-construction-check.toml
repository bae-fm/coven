# Handles (F.3): what an owner makes from its own state to be shared. Only
# the owner makes one; it, and the owners holding it, return a fresh one; a
# holder receives it when it is built.
[handles]
# A live query the database makes from its readers and commit observer for
# the app, which keeps it as long as it follows the results (api.md E4).
"sqlive::live_query::LiveQuery" = "coven_database::database::StoreDatabase"
"sqlive::live_query::ReconfigurableLiveQuery" = "coven_database::database::StoreDatabase"
# Replaces a live query's request from another task while the query waits
# for its next result (api.md E4).
"sqlive::live_query::LiveQueryRequests" = "sqlive::live_query::ReconfigurableLiveQuery"
# An app's request for idle passes at most its interval apart, held until it
# drops (api.md E5, §13.2), and an owner's view of the shortest one held:
# the sync loop's, and a waiting join's.
"coven_sync::sync_often::SyncOftenGuard" = "coven_sync::sync_often::SyncOften"
"coven_sync::sync_often::HeldIntervals" = "coven_sync::sync_often::SyncOften"
# Each change of the sync activity, for the file workers waiting until sync
# allows their transfers.
# A provider check's object while permitted, held for the check's scope.
"coven_sync::sequence_state::ProviderCheckPermit" = "coven_sync::sequence_state::SequenceState"
"coven_sync::sequence_state::SequenceStatusWatch" = "coven_sync::sequence_state::SequenceState"
# The running pass's first move, for the sync loop to write that it moves.
"coven_sync::sequence_state::PassMoves" = "coven_sync::sequence_state::SequenceState"
# The progress one kind of operation reports, such as a store's open or a
# load from storage, for the host drawing it (api.md E1).
"coven_foundation::progress::ProgressWatch" = "coven_foundation::progress::ProgressChannel"
# The answer to the person's retry: how the first pass after it ended
# (api.md E5).
"coven_sync::retry_waits::retry_answer::RetryAnswer" = "coven_sync::retry_waits::RetryWaits"
# Each network or retry report, for an owner waiting on its own timers
# (§6.7).
"coven_sync::retry_waits::network_report::NetworkReportWatch" = "coven_sync::retry_waits::RetryWaits"
# Each wait a failed attempt arms, so an owner plans again (§6.7).
"coven_sync::retry_waits::RearmWatch" = "coven_sync::retry_waits::RetryWaits"
# What the store's watch knows of the device's network, for each owner that
# acts on it (§6.7, §17.9).
"coven_foundation::network_watch::NetworkView" = "coven_foundation::network_watch::NetworkWatch"
# Sync starting and stopping, for the upload worker, which runs only while
# sync is started (§17.4).
"coven_sync::retry_waits::SyncingWatch" = "coven_sync::retry_waits::RetryWaits"
# The answer to an app's early retry of its uploads (§17.9).
"coven_sync::files::file_upload_pool::UploadRetryAnswer" = "coven_sync::files::FilesInner"
# What the file layer's storage is now, which readers match on, and the
# mark of a running connection attempt that keeps them waiting (§17.7).
"coven_sync::files::file_storage::StorageState" = "coven_sync::files::file_storage::StorageSlot"
"coven_sync::files::file_storage::ConnectionComing" = "coven_sync::files::Files"
# One observation of the store's commits, shared by the handle that tells
# it of each and what it watches for (§4).
"sqlive::handle::CommitSubscription" = "sqlive::handle::Handle"
# Commits to the rows a worker waits on, coalesced (§4).
"sqlive::database_changes::DatabaseChanges" = "sqlive::handle::Handle"
# The main database file's size after each checkpoint, for the host.
"sqlive::checkpointed_size::CheckpointedSize" = "sqlive::database::Database"
# How far each file in flight one way has got (api.md E7, E8).
"coven_database::transfer_watch::TransferWatch" = "coven_database::transfers_in_flight::InFlight"
# The files in flight one way, which the worker moving them marks as each
# attempt starts and ends (§17.8, §17.9).
"coven_database::transfers_in_flight::InFlight" = "coven_database::transfers_in_flight::TransfersInFlight"
# A value the host keeps in memory, as one connection's transactions take
# it at their snapshots, for the functions its setup registers (§4).
"sqlive::snapshot_values::SnapshotValue" = "sqlive::snapshot_values::SnapshotValues"
# Marks a store closing when its owner's scope ends, without holding its
# lock, so a reopen in this process waits for its release (F.4).
"coven_foundation::files::lock_registry::StoreClosingGuard" = "coven_foundation::files::lock_registry::LockRegistration"
# One input object's reading: every retained input of that object shares it,
# and the input database keeps its bytes while any does.
"coven_database::database::input_database::InputRead" = "coven_database::database::input_database::InputDatabase"

# The raw handles and coven's own SQL are the database boundary's subject;
# the SQLite capability's row names the database's home and the SQLite
# library beneath rusqlite.
[database]
capability = "SQLite"
schema = "crates/coven-schema/src/lib.rs"
table_macros = [
    "coven_tables",
    "coven_ownership_tables",
    "coven_input_tables",
    "coven_sequence_tables",
    "coven_claim_tables",
    "coven_published_tables",
    "coven_store_state_tables",
    "coven_authorship_tables",
    "coven_sequence_application_tables",
    "coven_write_headers_tables",
    "coven_written_values_tables",
    "coven_SQL_versions_tables",
    "coven_source_names_tables",
    "coven_write_boundaries_tables",
    "coven_retries_tables",
    "coven_uploads_tables",
    "coven_device_reset_tables",
    "coven_file_columns_tables",
    "coven_pin_requests_tables",
    "coven_file_moves_tables",
    "coven_data_reloads_tables",
    "coven_conversion_schemas_tables",
    "coven_migration_prefix_tables",
    "coven_schema_definitions_tables",
    "coven_device_only_copies_tables",
    "coven_file_protection_tables",
    "coven_merge_store_tables",
    "coven_operations_tables",
    "coven_file_uploads_tables",
    "coven_applied_sequence_tables",
    "coven_file_retention_tables",
    "coven_ended_requests_tables",
    "coven_raises_tables",
    "coven_object_removals_tables",
    "coven_provider_access_tables",
    "coven_pending_tables",
    "coven_migration_losses_tables",
    "coven_user_originals_tables",
    "coven_file_removals_tables",
    "coven_cache_tables",
    "coven_local_bytes_tables",
    "coven_creations_tables",
    "coven_authored_sources_tables",
    "coven_forgetting_tables",
    "coven_losses_tables",
]
# An open write: a function or closure taking one runs inside the write its
# caller opened, so a domain's tables are written there or in its owner's
# methods (F.2).
write_types = ["StoreSql"]
# The columns the SQL only counts up that may: each numbers something, as a
# sequence does, and makes no live query run again.
counters = [
    { column = "_coven_snapshot_reservation.number", reason = "numbers this device's snapshots: every preparation reserves the next number, so an abandoned attempt's path is never used again (§19.3)" },
]
# A scope plan reads a statement's tables and views through the connection
# that prepared the statement, and `parameters` reads the values bound to that
# statement: sqlive passes both its own connection and its own statement.
[[database.raw_handle_parameters]]
path = "crates/sqlive-reads/src/scope_plan.rs"
callable = "ScopePlan::build"

[[database.raw_handle_parameters]]
path = "crates/sqlive-reads/src/sql_value.rs"
callable = "parameters"

# Appendix F.2: the database's tables by the module that writes them. SQL
# anywhere may read a table; only its domain's homes write it, in a statement
